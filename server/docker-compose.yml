services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codeeditor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codeeditor"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/codeeditor
      APP_NAME: Hirelens API
      APP_VERSION: 0.2.0
      FRONTEND_ORIGIN: http://localhost:3000
      SECRET_KEY: change-me-to-a-long-random-secret-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ../client
    depends_on:
      app:
        condition: service_started
    environment:
      - BACKEND_URL=http://app:8000
    ports:
      - "3000:80"

volumes:
  postgres_data:
